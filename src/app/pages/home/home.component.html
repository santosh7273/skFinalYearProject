<div class="min-h-screen bg-slate-950 text-white pt-16">

  <!-- Hero Section -->
  <section class="relative overflow-hidden">

    <!-- Background Glow -->
    <div class="absolute inset-0 pointer-events-none">
      <div
        class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-teal-500/10 rounded-full blur-3xl">
      </div>

      <div
        class="absolute top-1/2 left-1/4 w-72 h-72 bg-cyan-500/5 rounded-full blur-2xl">
      </div>
    </div>

    <div
      class="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-24 sm:py-32 text-center">

      <!-- Badge -->
      <div
        class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-teal-500/30 bg-teal-500/10 text-teal-400 text-xs font-medium mb-8">

        <span class="w-1.5 h-1.5 bg-teal-400 rounded-full animate-pulse"></span>

        AI-Powered Hair and Scalp Condition Analysis
      </div>

      <!-- Heading -->
      <h1
        class="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight leading-tight mb-6">

        Detect Hair & Scalp
        <br />

        <span
          class="bg-gradient-to-r from-teal-400 to-cyan-400 bg-clip-text text-transparent">
          Conditions Instantly
        </span>
      </h1>

      <!-- Sub Text -->
      <p
        class="text-slate-400 text-lg sm:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">

        Upload a photo of your Hair/scalp and let our AI model identify the
        disease and provide personalized care recommendations.
      </p>

      <!-- Button -->
      <div class="flex justify-center">

        <a
          routerLink="/predict"
          class="group inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold transition-all duration-200 shadow-lg shadow-teal-500/25 hover:shadow-teal-400/40 hover:-translate-y-0.5">

          Start Analysis
          

          <svg
            class="w-4 h-4 group-hover:translate-x-1 transition-transform duration-200"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3">
            </path>

          </svg>

        </a>

      </div>

    </div>
  </section>

  <!-- Features -->
  <section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-24">

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

      <div
        *ngFor="let f of features"
        class="p-5 rounded-2xl border border-slate-800 bg-slate-900/50 hover:border-slate-700 transition-colors duration-200 group">

        <!-- Icon -->
        <div
          class="w-9 h-9 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-400 mb-4 group-hover:bg-teal-500/15 transition-colors duration-200">

          <!-- IMAGE ICON -->
          <svg
            *ngIf="f.icon === 'image'"
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5z">
            </path>

          </svg>

          <!-- AI ICON -->
          <svg
            *ngIf="f.icon === 'ai'"
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z">
            </path>

          </svg>

          <!-- REPORT ICON -->
          <svg
            *ngIf="f.icon === 'report'"
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12h3.75M9 15h3.75M9 18h3.75">
            </path>

          </svg>

        </div>

        <!-- Title -->
        <h3 class="text-white font-semibold mb-1.5">
          {{ f.title }}
        </h3>

        <!-- Desc -->
        <p class="text-slate-500 text-sm leading-relaxed">
          {{ f.desc }}
        </p>

      </div>

    </div>

  </section>

</div>
