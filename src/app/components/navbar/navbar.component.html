<nav
  class="fixed top-0 left-0 right-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800"
>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="flex items-center justify-between h-16">

      <!-- Brand -->
      <a
        routerLink="/"
        class="flex items-center gap-2 group"
      >
        <div
          class="w-8 h-8 rounded-lg bg-gradient-to-br from-teal-400 to-cyan-600 flex items-center justify-center shadow-lg shadow-teal-500/30"
        >
          <svg
            class="w-4 h-4 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"
            />
          </svg>
        </div>

        <span
          class="font-bold text-lg tracking-tight text-white group-hover:text-teal-400 transition-colors duration-200"
        >
          D16<span class="text-teal-400">_Project</span>
        </span>
      </a>

      <!-- Nav Links -->
      <div class="flex items-center gap-1">

        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.to"
          class="relative px-4 py-2 rounded-lg group"
        >

          <!-- Active Background -->
          <span
            *ngIf="isActive(link.to)"
            class="absolute inset-0 bg-teal-500/15 rounded-lg border border-teal-500/30"
          ></span>

          <!-- Text -->
          <span
            class="relative text-sm font-medium transition-colors duration-200"
            [ngClass]="
              isActive(link.to)
                ? 'text-teal-400'
                : 'text-slate-400 group-hover:text-white'
            "
          >
            {{ link.label }}
          </span>

        </a>

      </div>
    </div>
  </div>
</nav>
